name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate
        run: pnpm check

      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 --directory apps/game-web/dist > /tmp/grail-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/ > /tmp/index.html && break
            sleep 1
          done
          grep -q '<div id="root"></div>' /tmp/index.html
          curl --fail --silent http://127.0.0.1:4173/content/base-content.json > /tmp/content.json
          curl --fail --silent http://127.0.0.1:4173/bundle-report.json > /tmp/bundle-report.json

      - name: Upload browser pre-alpha
        uses: actions/upload-artifact@v4
        with:
          name: grail-conquest-browser-prealpha
          path: apps/game-web/dist
          if-no-files-found: error
          retention-days: 14
