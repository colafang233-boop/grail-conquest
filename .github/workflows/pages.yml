name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and verify web app
        run: |
          pnpm --filter @grail/game-web build
          pnpm bundle:check

      - name: Write release metadata
        run: |
          cat > apps/game-web/dist/release.json <<EOF
          {
            "version": "browser-prealpha-1.0",
            "commit": "${GITHUB_SHA}",
            "contentPack": "1.0.0-prealpha.1",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/game-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Public URL smoke test
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent "$URL" > /tmp/page.html; then
              break
            fi
            sleep 5
          done
          grep -q '<div id="root"></div>' /tmp/page.html
